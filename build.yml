name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - run: unzip HyperCam.zip
      - run: gradle assembleRelease
        working-directory: HyperCam
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp HyperCam/app/build/outputs/apk/release/app-release.apk HyperCam.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HyperCam.apk --title "HyperCam (latest)" --notes "Release APK" --target ${{ github.sha }}
